[project]
name = "bidu-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "bidu-timeline",
    "bidu-media",
    "bidu-analysis",
    "bidu-workflows",
]

[project.scripts]
bidu-web = "bidu_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidu_api"]

[tool.uv.sources]
bidu-timeline = { workspace = true }
bidu-media = { workspace = true }
bidu-analysis = { workspace = true }
bidu-workflows = { workspace = true }
