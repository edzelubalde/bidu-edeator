[project]
name = "bidu-workflows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.8", "bidu-timeline", "bidu-media", "bidu-analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidu_workflows"]

[tool.uv.sources]
bidu-timeline = { workspace = true }
bidu-media = { workspace = true }
bidu-analysis = { workspace = true }
