name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/gen_contracts.py --check
      - name: Cache generated fixtures
        uses: actions/cache@v4
        with:
          path: evals/fixtures/generated
          key: fixtures-${{ hashFiles('workers/media/src/bidu_media/testing.py') }}
      - run: uv run pytest -rs
