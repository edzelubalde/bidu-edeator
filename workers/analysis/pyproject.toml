[project]
name = "bidu-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "bidu-timeline", "bidu-media", "scenedetect[opencv-headless]>=0.6.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidu_analysis"]

[tool.uv.sources]
bidu-timeline = { workspace = true }
bidu-media = { workspace = true }

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
gemini = ["google-genai>=1.0"]
