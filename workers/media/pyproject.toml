[project]
name = "bidu-media"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "bidu-timeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidu_media"]

[tool.uv.sources]
bidu-timeline = { workspace = true }
